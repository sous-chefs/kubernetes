---
driver:
  name: dokken
  network_mode: kind
  chef_version: current
  binds:
    - <%= ENV.fetch("KITCHEN_KUBECONFIG") %>:/tmp/kitchen-kubeconfig:ro

transport:
  name: dokken

provisioner:
  name: dokken

platforms:
  - name: almalinux-8
    driver:
      image: dokken/almalinux-8
      pid_one_command: /bin/sleep infinity
  - name: almalinux-9
    driver:
      image: dokken/almalinux-9
      pid_one_command: /bin/sleep infinity
  - name: amazonlinux-2023
    driver:
      image: dokken/amazonlinux-2023
      pid_one_command: /bin/sleep infinity
  - name: centos-stream-9
    driver:
      image: dokken/centos-stream-9
      pid_one_command: /bin/sleep infinity
  - name: debian-12
    driver:
      image: dokken/debian-12
      pid_one_command: /bin/sleep infinity
  - name: debian-13
    driver:
      image: dokken/debian-13
      pid_one_command: /bin/sleep infinity
  - name: fedora-latest
    driver:
      image: dokken/fedora-latest
      pid_one_command: /bin/sleep infinity
  - name: opensuse-leap-16
    driver:
      image: opensuse/leap:16.0
      pid_one_command: /bin/sleep infinity
  - name: oraclelinux-8
    driver:
      image: dokken/oraclelinux-8
      pid_one_command: /bin/sleep infinity
  - name: oraclelinux-9
    driver:
      image: dokken/oraclelinux-9
      pid_one_command: /bin/sleep infinity
  - name: rockylinux-8
    driver:
      image: dokken/rockylinux-8
      pid_one_command: /bin/sleep infinity
  - name: rockylinux-9
    driver:
      image: dokken/rockylinux-9
      pid_one_command: /bin/sleep infinity
  - name: ubuntu-20.04
    driver:
      image: dokken/ubuntu-20.04
      pid_one_command: /bin/sleep infinity
  - name: ubuntu-22.04
    driver:
      image: dokken/ubuntu-22.04
      pid_one_command: /bin/sleep infinity
  - name: ubuntu-24.04
    driver:
      image: dokken/ubuntu-24.04
      pid_one_command: /bin/sleep infinity
