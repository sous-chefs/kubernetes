name: CI

"on":
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-unit:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      statuses: write
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.1

  integration:
    needs: lint-unit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - almalinux-8
          - almalinux-9
          - amazonlinux-2023
          - centos-stream-9
          - debian-12
          - debian-13
          - fedora-latest
          - opensuse-leap-16
          - oraclelinux-8
          - oraclelinux-9
          - rockylinux-8
          - rockylinux-9
          - ubuntu-2004
          - ubuntu-2204
          - ubuntu-2404
        suite:
          - default
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Chef
        uses: actionshub/chef-install@6.0.0
      - name: Create Kubernetes test cluster
        uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
          kubectl_version: v1.37.2
          cluster_name: cookbook-kubernetes
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      - name: Prepare Kubernetes fixtures and client credentials
        env:
          KITCHEN_KUBECONFIG: ${{ runner.temp }}/kitchen-kubeconfig
        run: |
          kubectl --context kind-cookbook-kubernetes apply --server-side --field-manager=chef-kubernetes -f test/support/fixtures.json
          kind get kubeconfig --internal --name cookbook-kubernetes > "$KITCHEN_KUBECONFIG"
          chmod 600 "$KITCHEN_KUBECONFIG"
      - name: Dokken
        uses: actionshub/test-kitchen@3.0.0
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
          KITCHEN_KUBECONFIG: ${{ runner.temp }}/kitchen-kubeconfig
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}

  final:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - run: echo "integration completed"
